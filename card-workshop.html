<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171310;
    --ink-2:#211a15;
    --panel-line:#3a2e22;
    --parchment:#efe1c3;
    --parchment-shade:#dcc89e;
    --ink-text:#2c2013;
    --cream:#f3e9d2;
    --muted:#9c8d74;
    --ember:#c98a2c;
    --ember-deep:#8a5a17;
    --teal:#2f5d52;
    --teal-deep:#1c3a33;
    --steel:#5f6f74;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 18% 0%, #2a2015 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #1c2b26 0%, transparent 50%),
      var(--ink);
    color:var(--cream);
    font-family:'Manrope', sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .app{
    max-width:1080px;
    margin:0 auto;
    padding:48px 28px 72px;
  }

  .app-header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 4vw, 38px);
    margin:0 0 8px;
    letter-spacing:0.01em;
  }

  .app-header p{
    margin:0;
    color:var(--muted);
    font-size:15px;
    max-width:52ch;
    line-height:1.6;
  }

  .workbench{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:36px;
    margin-top:40px;
    align-items:start;
  }

  @media (max-width:820px){
    .workbench{ grid-template-columns:1fr; }
  }

  section h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.03em;
    margin:0 0 18px;
    color:var(--cream);
    border-bottom:1px solid var(--panel-line);
    padding-bottom:10px;
  }

  .controls{
    background:var(--ink-2);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:24px;
  }

  .field{
    display:block;
    margin-bottom:18px;
  }

  .field-label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:7px;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 14px;
    margin-bottom:18px;
  }

  .stat-grid .field{ margin-bottom:0; }

  input[type="text"],
  input[type="number"],
  textarea,
  select{
    width:100%;
    background:var(--ink);
    border:1px solid var(--panel-line);
    border-radius:6px;
    color:var(--cream);
    font-family:'Manrope', sans-serif;
    font-size:14.5px;
    padding:10px 12px;
    resize:vertical;
  }

  textarea{ line-height:1.6; }

  select{
    appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    cursor:pointer;
  }

  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  button:focus-visible,
  .file-btn:focus-within{
    outline:2px solid var(--ember);
    outline-offset:1px;
  }

  .art-controls{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .file-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:9px 12px;
    font-size:14px;
    color:var(--cream);
    cursor:pointer;
    transition:border-color 150ms ease, color 150ms ease;
  }
  .file-btn:hover{ border-color:var(--ember); color:var(--ember); }

  .ghost-btn{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:13px;
    padding:2px 0;
    text-align:left;
    cursor:pointer;
    width:fit-content;
  }
  .ghost-btn:hover{ color:var(--ember); }

  .reset-btn{
    margin-top:6px;
    width:100%;
    background:var(--ember);
    color:#20140a;
    border:none;
    border-radius:6px;
    padding:11px 14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:background 150ms ease;
  }
  .reset-btn:hover{ background:#dda03e; }

  .preview-pane{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .preview-pane h2{ align-self:flex-start; width:100%; }

  .card-stage{
    width:100%;
    display:flex;
    justify-content:center;
    padding:20px 0 8px;
  }

  .card{
    position:relative;
    width:300px;
    aspect-ratio:5 / 7;
    background:var(--parchment);
    border:6px solid var(--ink-text);
    border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,0.45);
    padding:14px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    color:var(--ink-text);
  }

  .card-cost-gem{
    position:absolute;
    top:-16px;
    left:-16px;
    width:52px;
    height:52px;
    background:linear-gradient(155deg, var(--ember) 0%, var(--ember-deep) 100%);
    clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
    box-shadow:0 3px 8px rgba(0,0,0,0.4);
  }

  .card-cost-gem span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    color:#241705;
    transform:translateY(1px);
  }

  .card-name-plate{
    background:var(--ink-text);
    clip-path:polygon(3% 0%, 97% 0%, 100% 50%, 97% 100%, 3% 100%, 0% 50%);
    padding:9px 26px;
    text-align:center;
  }

  .card-name-plate span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    color:var(--cream);
    letter-spacing:0.03em;
  }

  .card-name-plate span.placeholder{
    color:var(--muted);
    font-style:italic;
    font-weight:500;
  }

  .card-art-window{
    position:relative;
    flex:1;
    border-radius:6px;
    background:var(--parchment-shade);
    border:1px solid rgba(44,32,19,0.25);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card-middle{
    display:flex;
    flex:1;
    gap:6px;
    min-height:0;
  }

  .stats-rail{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:50px;
    flex-shrink:0;
    min-height:0;
  }

  .stat-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:rgba(44,32,19,0.08);
    border:1px solid rgba(44,32,19,0.2);
    border-radius:6px;
    padding:4px 2px;
  }

  .stat-icon{
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .stat-icon.icon-power{ background:var(--ember); }
  .stat-icon.icon-wisdom{ background:var(--teal); }
  .stat-icon.icon-defense{ background:var(--ink-text); }
  .stat-icon.icon-speed{ background:var(--steel); }

  .stat-value{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:14px;
    line-height:1.1;
  }

  .stat-label{
    font-size:8.5px;
    color:var(--muted);
    line-height:1.1;
    text-align:center;
  }

  .card-art-window img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .art-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:rgba(44,32,19,0.45);
  }

  .art-placeholder span{ font-size:12px; }

  .card-effect-box{
    background:var(--teal);
    border-radius:6px;
    padding:10px 12px;
    min-height:26%;
  }

  .card-effect-box p{
    margin:0;
    font-family:'Fraunces', serif;
    font-size:12.5px;
    line-height:1.55;
    color:var(--cream);
    white-space:pre-wrap;
  }

  .card-effect-box p.placeholder{
    color:rgba(243,233,210,0.5);
    font-style:italic;
  }

  @keyframes fx-shake-kf{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(4px); }
  }
  .card.fx-shake{ animation:fx-shake-kf 0.5s ease-in-out; }

  @keyframes fx-move-kf{
    0%{ transform:translate(0,0) scale(1); }
    35%{ transform:translate(0,-16px) scale(1.03); }
    65%{ transform:translate(0,4px) scale(0.99); }
    100%{ transform:translate(0,0) scale(1); }
  }
  .card.fx-move{ animation:fx-move-kf 0.55s ease-out; }

  @keyframes fx-flash-kf{
    0%{ opacity:0; }
    35%{ opacity:0.9; }
    100%{ opacity:0; }
  }
  .card.fx-flash::after{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:16px;
    background:#fff;
    z-index:5;
    pointer-events:none;
    animation:fx-flash-kf 0.45s ease-out;
  }

  @keyframes fx-glow-kf{
    0%{ box-shadow:0 18px 40px rgba(0,0,0,0.45), 0 0 0 rgba(255,205,120,0); }
    45%{ box-shadow:0 18px 40px rgba(0,0,0,0.45), 0 0 46px 14px rgba(255,205,120,0.85); }
    100%{ box-shadow:0 18px 40px rgba(0,0,0,0.45), 0 0 0 rgba(255,205,120,0); }
  }
  .card.fx-glow{ animation:fx-glow-kf 0.7s ease-in-out; }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <h1>カード工房</h1>
    <p>名前・コスト・ステータス(ちから/かしこさ/みのまもり/すばやさ)・アート・効果・演出を設定すると、右側のプレビューに反映されます。演出はプルダウンで選ぶと、その場でアニメーションが一度再生されます。</p>
  </div>

  <div class="workbench">

    <section class="controls">
      <h2>設定</h2>

      <label class="field">
        <span class="field-label">名前</span>
        <input type="text" id="nameInput" maxlength="20" value="ミストウルフ">
      </label>

      <label class="field">
        <span class="field-label">コスト</span>
        <input type="number" id="costInput" min="0" max="20" value="3">
      </label>

      <div class="stat-grid">
        <label class="field">
          <span class="field-label">ちから</span>
          <input type="number" id="powerInput" min="0" max="999" value="64">
        </label>
        <label class="field">
          <span class="field-label">かしこさ</span>
          <input type="number" id="wisdomInput" min="0" max="999" value="97">
        </label>
        <label class="field">
          <span class="field-label">みのまもり</span>
          <input type="number" id="defenseInput" min="0" max="999" value="22">
        </label>
        <label class="field">
          <span class="field-label">すばやさ</span>
          <input type="number" id="speedInput" min="0" max="999" value="38">
        </label>
      </div>

      <div class="field">
        <span class="field-label">アート</span>
        <div class="art-controls">
          <label class="file-btn">
            画像を選ぶ
            <input type="file" id="artFileInput" accept="image/*" hidden>
          </label>
          <input type="text" id="artUrlInput" placeholder="または画像のURLを入力">
          <button type="button" id="clearArtBtn" class="ghost-btn">画像をクリア</button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">効果</span>
        <textarea id="effectInput" rows="5" maxlength="140">このカードが場に出た時、相手モンスター1体を1ターン行動不能にする。</textarea>
      </label>

      <label class="field">
        <span class="field-label">演出</span>
        <select id="fxSelect">
          <option value="none" selected>なし</option>
          <option value="shake">揺れ</option>
          <option value="move">移動</option>
          <option value="flash">明転</option>
          <option value="glow">発光</option>
        </select>
      </label>

      <button type="button" id="resetBtn" class="reset-btn">全てリセット</button>
    </section>

    <section class="preview-pane">
      <h2>プレビュー</h2>
      <div class="card-stage">
        <div class="card">
          <div class="card-cost-gem"><span id="costDisplay">3</span></div>

          <div class="card-name-plate"><span id="nameDisplay">ミストウルフ</span></div>

          <div class="card-middle">
            <div class="stats-rail">
              <div class="stat-block">
                <span class="stat-icon icon-power">
                  <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#f3e9d2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="2" x2="8" y2="10.5"/>
                    <line x1="5" y1="5.5" x2="11" y2="5.5"/>
                    <path d="M6 10.5L8 13L10 10.5"/>
                  </svg>
                </span>
                <span class="stat-value" id="powerDisplay">64</span>
                <span class="stat-label">ちから</span>
              </div>
              <div class="stat-block">
                <span class="stat-icon icon-wisdom">
                  <svg viewBox="0 0 16 16" width="13" height="13" fill="#f3e9d2">
                    <path d="M8 1L9.4 6.6L15 8L9.4 9.4L8 15L6.6 9.4L1 8L6.6 6.6Z"/>
                  </svg>
                </span>
                <span class="stat-value" id="wisdomDisplay">97</span>
                <span class="stat-label">かしこさ</span>
              </div>
              <div class="stat-block">
                <span class="stat-icon icon-defense">
                  <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#f3e9d2" stroke-width="1.3" stroke-linejoin="round">
                    <path d="M8 1.5L13 3.3V7.5C13 10.8 8 14 8 14C8 14 3 10.8 3 7.5V3.3L8 1.5Z"/>
                  </svg>
                </span>
                <span class="stat-value" id="defenseDisplay">22</span>
                <span class="stat-label">みのまもり</span>
              </div>
              <div class="stat-block">
                <span class="stat-icon icon-speed">
                  <svg viewBox="0 0 16 16" width="13" height="13" fill="#f3e9d2">
                    <path d="M2 12C5.5 10.5 6.5 6 6 2C9.5 3.5 9 8 14 7.5C11.5 11 8.5 12.5 6 10.5C4.5 12 3 12.5 2 12Z"/>
                  </svg>
                </span>
                <span class="stat-value" id="speedDisplay">38</span>
                <span class="stat-label">すばやさ</span>
              </div>
            </div>

            <div class="card-art-window" id="artWindow">
              <div class="art-placeholder" id="artPlaceholder">
                <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M4 34L16 18L24 28L32 14L44 34" />
                  <circle cx="37" cy="10" r="4" />
                </svg>
                <span>アート未設定</span>
              </div>
              <img id="artImg" alt="" hidden>
            </div>
          </div>

          <div class="card-effect-box"><p id="effectDisplay">このカードが場に出た時、相手モンスター1体を1ターン行動不能にする。</p></div>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
  const nameInput = document.getElementById('nameInput');
  const costInput = document.getElementById('costInput');
  const powerInput = document.getElementById('powerInput');
  const wisdomInput = document.getElementById('wisdomInput');
  const defenseInput = document.getElementById('defenseInput');
  const speedInput = document.getElementById('speedInput');
  const effectInput = document.getElementById('effectInput');
  const artFileInput = document.getElementById('artFileInput');
  const artUrlInput = document.getElementById('artUrlInput');
  const clearArtBtn = document.getElementById('clearArtBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fxSelect = document.getElementById('fxSelect');

  const nameDisplay = document.getElementById('nameDisplay');
  const costDisplay = document.getElementById('costDisplay');
  const powerDisplay = document.getElementById('powerDisplay');
  const wisdomDisplay = document.getElementById('wisdomDisplay');
  const defenseDisplay = document.getElementById('defenseDisplay');
  const speedDisplay = document.getElementById('speedDisplay');
  const effectDisplay = document.getElementById('effectDisplay');
  const artImg = document.getElementById('artImg');
  const artPlaceholder = document.getElementById('artPlaceholder');
  const cardEl = document.querySelector('.card');
  const fxClasses = ['fx-shake', 'fx-move', 'fx-flash', 'fx-glow'];

  function syncName(){
    const value = nameInput.value.trim();
    if(value){
      nameDisplay.textContent = value;
      nameDisplay.classList.remove('placeholder');
    } else {
      nameDisplay.textContent = '(名称未設定)';
      nameDisplay.classList.add('placeholder');
    }
  }

  function syncCost(){
    const value = parseInt(costInput.value, 10);
    costDisplay.textContent = Number.isFinite(value) && value >= 0 ? value : '0';
  }

  function syncStat(input, display){
    const value = parseInt(input.value, 10);
    display.textContent = Number.isFinite(value) && value >= 0 ? value : '0';
  }

  function syncStats(){
    syncStat(powerInput, powerDisplay);
    syncStat(wisdomInput, wisdomDisplay);
    syncStat(defenseInput, defenseDisplay);
    syncStat(speedInput, speedDisplay);
  }

  function syncEffect(){
    const value = effectInput.value.trim();
    if(value){
      effectDisplay.textContent = effectInput.value;
      effectDisplay.classList.remove('placeholder');
    } else {
      effectDisplay.textContent = '(効果テキスト未入力)';
      effectDisplay.classList.add('placeholder');
    }
  }

  function showArtImage(src){
    artImg.src = src;
    artImg.hidden = false;
    artPlaceholder.hidden = true;
  }

  function clearArt(){
    artImg.removeAttribute('src');
    artImg.hidden = true;
    artPlaceholder.hidden = false;
    artUrlInput.value = '';
    artFileInput.value = '';
  }

  artImg.addEventListener('error', () => {
    if(artImg.getAttribute('src')){ clearArt(); }
  });

  nameInput.addEventListener('input', syncName);
  costInput.addEventListener('input', syncCost);
  powerInput.addEventListener('input', syncStats);
  wisdomInput.addEventListener('input', syncStats);
  defenseInput.addEventListener('input', syncStats);
  speedInput.addEventListener('input', syncStats);
  effectInput.addEventListener('input', syncEffect);

  artFileInput.addEventListener('change', () => {
    const file = artFileInput.files && artFileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => showArtImage(reader.result);
    reader.readAsDataURL(file);
  });

  artUrlInput.addEventListener('input', () => {
    const value = artUrlInput.value.trim();
    if(value){ showArtImage(value); } else { clearArt(); }
  });

  clearArtBtn.addEventListener('click', clearArt);

  fxSelect.addEventListener('change', () => {
    const type = fxSelect.value;
    if(type === 'none') return;
    cardEl.classList.remove(...fxClasses);
    void cardEl.offsetWidth;
    cardEl.classList.add('fx-' + type);
  });

  cardEl.addEventListener('animationend', () => {
    cardEl.classList.remove(...fxClasses);
  });

  resetBtn.addEventListener('click', () => {
    nameInput.value = '';
    costInput.value = '0';
    powerInput.value = '0';
    wisdomInput.value = '0';
    defenseInput.value = '0';
    speedInput.value = '0';
    effectInput.value = '';
    fxSelect.value = 'none';
    cardEl.classList.remove(...fxClasses);
    clearArt();
    syncName();
    syncCost();
    syncStats();
    syncEffect();
  });

  syncName();
  syncCost();
  syncStats();
  syncEffect();
</script>
</body>
</html>
