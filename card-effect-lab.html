<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>演出プレビューラボ｜モンスターカード演出サンプル集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;
    --bg-panel:#141a22;
    --bg-panel-soft:#0f141b;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.16);
    --text-primary:#eef1f5;
    --text-secondary:#8996a6;
    --text-faint:#5c6675;
    --accent-gold:#cf9f4e;
    --accent-gold-soft:rgba(207,159,78,.16);
    --accent-blue:#3f8fd1;
    --font-display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
    --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    padding:32px 20px 60px;
  }

  .page{
    max-width:1180px;
    margin:0 auto;
  }

  /* ---------- header ---------- */

  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:32px;
    padding-bottom:24px;
    border-bottom:1px solid var(--border);
  }

  .title-block h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 10px;
    letter-spacing:.02em;
  }

  .title-block .subtitle{
    margin:0;
    max-width:520px;
    color:var(--text-secondary);
    line-height:1.8;
    font-size:14.5px;
  }

  .stat{
    text-align:right;
  }

  .stat-num{
    display:block;
    font-family:var(--font-display);
    font-size:38px;
    color:var(--accent-gold);
    line-height:1;
  }

  .stat-label{
    display:block;
    margin-top:6px;
    font-size:12.5px;
    color:var(--text-secondary);
  }

  /* ---------- layout ---------- */

  .layout{
    display:grid;
    grid-template-columns:1.25fr 380px;
    gap:28px;
    align-items:start;
  }

  @media (max-width:900px){
    .layout{ grid-template-columns:1fr; }
  }

  /* ---------- stage ---------- */

  .stage-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .stage{
    width:100%;
    min-height:460px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:52px 24px;
    border-radius:var(--radius-lg);
    border:1px solid var(--border);
    background:
      radial-gradient(ellipse 70% 60% at 50% 38%, #1c2635 0%, #0f141b 62%, #090c10 100%);
    position:relative;
    perspective:1000px;
    overflow:hidden;
  }

  .stage::after{
    /* ground shadow: gives the card a sense of standing on a stage */
    content:"";
    position:absolute;
    left:50%;
    bottom:9%;
    width:44%;
    height:26px;
    background:radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%);
    transform:translateX(-50%);
    filter:blur(2px);
  }

  .frame{
    position:relative;
    width:min(340px,72vw);
    aspect-ratio:797 / 1080;
    margin:0 auto;
    /* no overflow:hidden here on purpose — particle / ring effects
       are allowed to spill outside the card's own edges. Only the
       card artwork itself (.card-visual) gets clipped to its shape. */
  }

  .card-visual{
    position:absolute;
    inset:0;
    border-radius:var(--radius-md);
    overflow:hidden;
    background:#0a0d12;
    box-shadow:
      0 24px 60px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.07);
  }

  #cardImg,#cardCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  #cardCanvas{ display:none; }

  .ghost-layer{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
  }

  .fx-ghost{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .fx-child{ position:absolute; }

  .fx-shine{
    top:-60%; left:-20%;
    width:40%; height:220%;
    background:linear-gradient(75deg,
      transparent, rgba(255,255,255,0) 40%,
      rgba(255,255,255,.92) 50%,
      rgba(255,255,255,0) 60%, transparent);
    mix-blend-mode:screen;
  }

  .fx-rays{
    top:50%; left:50%;
    width:230%; height:230%;
    margin:-115% 0 0 -115%;
    border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.85) 0deg 3deg, transparent 3deg 16deg);
    mix-blend-mode:screen;
  }

  .fx-scanbar{
    left:0; top:-4%;
    width:100%; height:3%;
    background:linear-gradient(90deg, transparent, #bfe9ff, #ffffff, #bfe9ff, transparent);
    box-shadow:0 0 14px 2px rgba(180,230,255,.75);
  }

  .ring{
    position:absolute;
    inset:-7%;
    border-radius:22px;
    border:6px solid rgba(255,214,120,.85);
    opacity:0;
    pointer-events:none;
  }

  .particle-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
  }

  .particle{
    position:absolute;
    pointer-events:none;
    will-change:transform,opacity;
  }

  .particle-sparkle{
    background:linear-gradient(135deg,#fff,#ffe9a8);
    clip-path:polygon(50% 0%,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0% 50%,40% 40%);
    filter:drop-shadow(0 0 4px rgba(255,244,200,.85));
  }

  .particle-explode{
    border-radius:50%;
    filter:drop-shadow(0 0 3px rgba(255,180,90,.8));
  }

  .caption{
    margin:14px 0 0;
    font-size:12.5px;
    color:var(--text-faint);
    text-align:center;
  }

  /* ---------- panel ---------- */

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .control-block label{
    display:block;
    font-size:13px;
    color:var(--text-secondary);
    margin-bottom:8px;
  }

  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--bg-panel-soft) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9"><path d="M1 1l6 6 6-6" fill="none" stroke="%238996a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
    border:1px solid var(--border-strong);
    color:var(--text-primary);
    font-family:var(--font-body);
    font-size:14.5px;
    padding:11px 36px 11px 14px;
    border-radius:var(--radius-sm);
  }

  select:focus-visible,
  button:focus-visible{
    outline:2px solid var(--accent-blue);
    outline-offset:2px;
  }

  optgroup{ font-weight:700; color:var(--text-secondary); }
  option{ color:#111; font-weight:400; }

  .button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .btn{
    flex:1 1 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:11px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:var(--bg-panel-soft);
    color:var(--text-primary);
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
    white-space:nowrap;
  }

  .btn:hover{ background:#182029; border-color:rgba(255,255,255,.24); }
  .btn:active{ transform:translateY(1px); }

  .btn-primary{
    background:var(--accent-gold);
    border-color:var(--accent-gold);
    color:#20150a;
    font-weight:700;
  }

  .btn-primary:hover{ background:#e0b562; border-color:#e0b562; }

  .btn svg{ width:14px; height:14px; flex:none; }

  .notes{
    background:var(--bg-panel-soft);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px;
  }

  .notes h2{
    margin:0 0 12px;
    font-size:14px;
    font-weight:700;
    color:var(--text-primary);
  }

  .notes-meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }

  .chip{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    background:var(--accent-gold-soft);
    color:var(--accent-gold);
    border:1px solid rgba(207,159,78,.4);
  }

  .tech{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    font-family:var(--font-mono);
    color:var(--text-secondary);
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
  }

  #notesText{
    margin:0;
    font-size:13.5px;
    line-height:1.85;
    color:var(--text-secondary);
  }

  .howto{
    font-size:12px;
    line-height:1.8;
    color:var(--text-faint);
  }

  @media (prefers-reduced-motion:reduce){
    .btn, select{ transition:none; }
  }

  /* ============================================================
     @keyframes 一覧
     ------------------------------------------------------------
     31種類の演出は、実はキーフレーム定義としては20個ほどしかない。
     多くの「基本演出」は fxEnter 1つを共有し、JS側でCSSカスタム
     プロパティ(--fx-op / --fx-tf)を書き換えることで見た目を変えている。
     ============================================================ */

  @keyframes fxEnter{
    from{ opacity:var(--fx-op,0); transform:var(--fx-tf,none); }
    to{ opacity:1; transform:none; }
  }

  @keyframes fxBounceIn{
    0%   { opacity:0; transform:scale(.3) translateY(-30px); }
    40%  { opacity:1; transform:scale(1.08) translateY(6px); }
    60%  { transform:scale(.96) translateY(-4px); }
    80%  { transform:scale(1.03) translateY(2px); }
    100% { transform:scale(1) translateY(0); }
  }

  @keyframes fxShake{
    0%,100%{ transform:translateX(0); }
    10%{ transform:translateX(-10px) rotate(-1deg); }
    20%{ transform:translateX(9px) rotate(1deg); }
    30%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    50%{ transform:translateX(-5px); }
    60%{ transform:translateX(4px); }
    70%{ transform:translateX(-3px); }
    80%{ transform:translateX(2px); }
    90%{ transform:translateX(-1px); }
  }

  @keyframes fxPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  @keyframes fxFlash{
    0%{ opacity:0; }
    10%{ opacity:.95; }
    100%{ opacity:0; }
  }

  @keyframes fxRingExpand{
    0%{ transform:scale(.4); opacity:.9; border-width:6px; }
    70%{ opacity:.3; }
    100%{ transform:scale(1.8); opacity:0; border-width:1px; }
  }

  @keyframes fxFlipY{
    0%{ opacity:0; transform:perspective(900px) rotateY(-100deg); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:perspective(900px) rotateY(0deg); }
  }

  @keyframes fxFlipX{
    0%{ opacity:0; transform:perspective(900px) rotateX(90deg); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:perspective(900px) rotateX(0deg); }
  }

  @keyframes fxShineSweep{
    0%{ transform:translateX(-130%) rotate(20deg); opacity:0; }
    15%{ opacity:.9; }
    55%{ opacity:.9; }
    100%{ transform:translateX(230%) rotate(20deg); opacity:0; }
  }

  @keyframes fxHoloShimmer{
    0%{ background-position:0% 50%; filter:hue-rotate(0deg); }
    100%{ background-position:200% 50%; filter:hue-rotate(360deg); }
  }

  @keyframes fxRaysSpin{
    0%{ transform:scale(.2) rotate(0deg); opacity:0; }
    20%{ opacity:.9; }
    100%{ transform:scale(1.15) rotate(45deg); opacity:0; }
  }

  @keyframes fxSparkle{
    0%{ transform:translateY(0) scale(0); opacity:0; }
    20%{ opacity:1; transform:translateY(-6px) scale(1); }
    80%{ opacity:1; }
    100%{ transform:translateY(-46px) scale(.4); opacity:0; }
  }

  @keyframes fxAuraPulse{
    0%,100%{ filter:drop-shadow(0 0 14px rgba(255,215,120,.55)) drop-shadow(0 0 28px rgba(120,180,255,.35)); }
    50%{ filter:drop-shadow(0 0 26px rgba(255,215,120,.85)) drop-shadow(0 0 46px rgba(120,180,255,.55)); }
  }

  @keyframes fxExplodeParticle{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2); opacity:0; }
  }

  @keyframes fxGlitchShift{
    0%,100%{ opacity:0; transform:translate(0,0); clip-path:inset(0 0 0 0); }
    10%{ opacity:.8; transform:translate(-6px,-2px); clip-path:inset(10% 0 60% 0); }
    20%{ transform:translate(5px,1px); clip-path:inset(40% 0 20% 0); }
    30%{ opacity:.8; transform:translate(-4px,2px); clip-path:inset(70% 0 5% 0); }
    40%{ transform:translate(6px,-1px); clip-path:inset(5% 0 80% 0); }
    50%{ opacity:.6; transform:translate(-3px,0); clip-path:inset(30% 0 40% 0); }
    60%{ transform:translate(4px,2px); }
    70%{ opacity:.4; }
    80%{ opacity:0; }
  }

  @keyframes fxGlitchJitter{
    0%,100%{ transform:translate(0,0) skewX(0deg); }
    20%{ transform:translate(-3px,1px) skewX(1deg); }
    40%{ transform:translate(3px,-1px) skewX(-1deg); }
    60%{ transform:translate(-2px,2px); }
    80%{ transform:translate(2px,-2px); }
  }

  @keyframes fxScanWipe{
    from{ clip-path:inset(0 0 100% 0); }
    to{ clip-path:inset(0 0 0% 0); }
  }

  @keyframes fxScanBar{
    from{ top:-4%; opacity:.9; }
    90%{ opacity:.9; }
    to{ top:104%; opacity:0; }
  }

  @keyframes fxBlurFocus{
    from{ filter:blur(22px) brightness(1.3); opacity:.4; }
    to{ filter:blur(0) brightness(1); opacity:1; }
  }

  @keyframes fxKenBurns{
    0%{ transform:scale(1) translate(0,0); }
    50%{ transform:scale(1.12) translate(-1.5%,-1%); }
    100%{ transform:scale(1) translate(0,0); }
  }

</style>
</head>

<div class="page">

  <header class="page-header">
    <div class="title-block">
      <h1>演出プレビューラボ</h1>
      <p class="subtitle">画像に適用する「演出」（アニメーション表現）を切り替えて見比べるための検証ツールです。実装のパターンを学ぶための標本として、ドロップダウンから好きな演出を選んで再生してください。</p>
    </div>
    <div class="stat">
      <span class="stat-num" id="statNum">–</span>
      <span class="stat-label">種類の演出を収録</span>
    </div>
  </header>

<script>
/* ============================================================
   演出プレビューラボ ― 実装ノート
   ------------------------------------------------------------
   このスクリプトは「演出（アニメーション表現）」を量産・管理する
   ときの設計パターンを示すサンプルです。ポイントは3つ:

   1. 実装(関数)とメタ情報(EFFECTS配列)を分離する
      → play*() が実際の動きを作る関数、EFFECTS がラベルや
        カテゴリ、解説テキストなどのカタログ情報。UIはEFFECTSだけ
        見ればよく、演出の中身を知らなくても一覧・切り替えができる。

   2. すべての演出に「後片付け」をセットで用意する
      → setTimeout/setInterval のIDやイベントリスナ、継続animation
        は resetStage() で一括停止できるようにしておく。これがないと
        演出を切り替えるたびに前の演出が残り続けてバグの温床になる。

   3. 小さい演出を組み合わせて大きい演出を作る
      → 「レアリティ演出コンボ」は、新しい動きを何も作らず、
        既存のplay*()関数をタイミングをずらして呼ぶだけで成立する。
   ============================================================ */

/* ---------------- DOM参照 ---------------- */
const stage         = document.getElementById('stage');
const frame         = document.getElementById('frame');
const img           = document.getElementById('cardImg');
const canvas        = document.getElementById('cardCanvas');
const ghostLayer    = document.getElementById('ghostLayer');
const overlay       = document.getElementById('overlay');
const ring          = document.getElementById('ring');
const particleLayer = document.getElementById('particleLayer');

const effectSelect  = document.getElementById('effectSelect');
const playBtn       = document.getElementById('playBtn');
const randomBtn     = document.getElementById('randomBtn');
const resetBtn      = document.getElementById('resetBtn');
const statNum       = document.getElementById('statNum');
const notesGroup    = document.getElementById('notesGroup');
const notesTech     = document.getElementById('notesTech');
const notesText     = document.getElementById('notesText');

const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- 後片付け管理 ----------------
   すべての演出が使う「タイマー / インターバル / 継続処理の停止関数」を
   ここに集約する。演出を切り替える直前には必ず resetStage() を呼び、
   前の演出の残骸（タイマー・イベントリスナ・inline animation）を消す。 */
let activeTimers = [];
let activeIntervals = [];
let activeCleanup = null;

function addTimer(fn, ms){
  const id = setTimeout(fn, ms);
  activeTimers.push(id);
  return id;
}
function addInterval(fn, ms){
  const id = setInterval(fn, ms);
  activeIntervals.push(id);
  return id;
}
function setCleanup(fn){
  activeCleanup = fn;
}

function resetStage(){
  activeTimers.forEach(clearTimeout);
  activeTimers = [];
  activeIntervals.forEach(clearInterval);
  activeIntervals = [];
  if (activeCleanup){ activeCleanup(); activeCleanup = null; }

  [frame, img, overlay, ring, particleLayer, ghostLayer].forEach(el=>{
    el.style.animation = '';
  });

  frame.style.transform = '';
  frame.style.transition = '';

  img.style.transform = '';
  img.style.filter = '';
  img.style.opacity = '';
  img.style.clipPath = '';
  img.style.visibility = '';
  img.style.removeProperty('--fx-op');
  img.style.removeProperty('--fx-tf');

  overlay.style.background = '';
  overlay.style.backgroundSize = '';
  overlay.style.backgroundPosition = '';
  overlay.style.mixBlendMode = '';
  overlay.style.opacity = '';
  overlay.innerHTML = '';

  ring.style.opacity = '0';

  particleLayer.innerHTML = '';

  ghostLayer.innerHTML = '';
  ghostLayer.style.opacity = '0';

  canvas.style.display = 'none';
}

/* ---------------- animationを「必ず頭から」再生するヘルパー ----------------
   同じ animation-name を続けて指定しても、ブラウザは「値が変わっていない」
   と判断して再生し直してくれない。一度 animation:none にしてから
   offsetWidth を読むことで強制的にリフローを起こし、再生をリセットする。 */
function setAnim(el, name, opts = {}){
  const {
    duration = '0.8s',
    easing   = 'ease',
    fill     = 'forwards',
    iteration = '1',
    delay    = '0s',
  } = opts;

  el.style.animation = 'none';
  void el.offsetWidth; // 強制リフロー
  el.style.animationName = name;
  el.style.animationDuration = duration;
  el.style.animationTimingFunction = easing;
  el.style.animationFillMode = fill;
  el.style.animationIterationCount = REDUCE_MOTION && iteration === 'infinite' ? '2' : iteration;
  el.style.animationDelay = delay;
}

function buildCtx(){
  return { stage, frame, img, canvas, overlay, ring, particleLayer, ghostLayer,
           addTimer, addInterval, setCleanup };
}

/* ============================================================
   基本演出（エントランス）
   ------------------------------------------------------------
   9つの登場演出のうち8つは、実は同じ @keyframes fxEnter を
   共有している。CSSカスタムプロパティ(--fx-op / --fx-tf)に
   「開始時点の見た目」だけを渡し、キーフレーム自体は使い回す
   ことで、ほぼ同じ処理の重複を避けている。
   ============================================================ */

function enter(el, {op = '0', tf = 'none', duration = '0.8s', easing = 'ease-out'} = {}){
  el.style.setProperty('--fx-op', op);
  el.style.setProperty('--fx-tf', tf);
  setAnim(el, 'fxEnter', {duration, easing});
}

function playFadeIn(ctx){
  enter(ctx.img, {op:'0', tf:'none', duration:'0.9s', easing:'ease-out'});
}
function playZoomIn(ctx){

function spawnParticles(ctx, count, compute){
  for (let i = 0; i < count; i++){
    const p = document.createElement('span');

    ctx.particleLayer.appendChild(p);
    const dur   = parseFloat(p.dataset.dur   || '0.9');
    const delay = parseFloat(p.dataset.delay || '0');
    ctx.addTimer(()=>p.remove(), (dur + delay) * 1000 + 80);
  }
}

    const delay = +(Math.random() * 0.5).toFixed(2);
    const size  = 4 + Math.random() * 6;
    p.className = 'particle particle-sparkle';
    p.dataset.dur = dur; p.dataset.delay = delay;

    p.style.top  = top + '%';

    const dy = Math.sin(angle) * dist;
    const dur  = +(0.5 + Math.random() * 0.4).toFixed(2);
    const size = 3 + Math.random() * 5;
    const hue  = 20 + Math.random() * 40;

    p.style.animation = `fxExplodeParticle ${dur}s cubic-bezier(.2,.8,.3,1) 1 forwards`;

function playGlitch(ctx){
  const {img, ghostLayer} = ctx;
  ghostLayer.innerHTML = '';
  const makeGhost = (filterCss)=>{
    const g = img.cloneNode(); // src(data URI)ごと複製されるのでネットワーク通信は発生しない
    g.className = 'fx-ghost';
    g.style.filter = filterCss;
    g.style.mixBlendMode = 'screen';
    ghostLayer.appendChild(g);
    return g;
  };
  const gr = makeGhost('sepia(1) saturate(6) hue-rotate(-50deg) brightness(1.1)');
  const gb = makeGhost('sepia(1) saturate(6) hue-rotate(160deg) brightness(1.1)');
  ghostLayer.style.opacity = '1';
  setAnim(gr, 'fxGlitchShift', {duration:'0.7s', easing:'steps(8,end)'});
  setAnim(gb, 'fxGlitchShift', {duration:'0.7s', easing:'steps(7,end)', delay:'0.03s'});
  setAnim(img, 'fxGlitchJitter', {duration:'0.7s', easing:'steps(6,jump-start)'});
  ctx.addTimer(()=>{ ghostLayer.innerHTML = ''; ghostLayer.style.opacity = '0'; }, 750);
}

function playScanlineReveal(ctx){
  const {img, overlay} = ctx;
  img.style.clipPath = 'inset(0 0 100% 0)';
  setAnim(img, 'fxScanWipe', {duration:'0.9s', easing:'ease-in-out'});
  const bar = document.createElement('div');
  bar.className = 'fx-child fx-scanbar';
  overlay.appendChild(bar);
  setAnim(bar, 'fxScanBar', {duration:'0.9s', easing:'linear'});
  ctx.addTimer(()=>{ img.style.clipPath = ''; bar.remove(); }, 950);
}

function playBlurFocus(ctx){

function playPixelDissolve(ctx){
  // CSSではなくcanvasでピクセルそのものを描き直す例。
  // 小さい解像度で描画 → 拡大表示(image-smoothing無効)を繰り返し、
  // 段階的にブロックサイズを小さくして「解像していく」感じを作る。
  const {img, canvas} = ctx;
  const w = canvas.width  = img.clientWidth  || 340;
  const h = canvas.height = img.clientHeight || 460;
  const mainCx = canvas.getContext('2d');
  mainCx.imageSmoothingEnabled = false;
  const tmp = document.createElement('canvas');
  const tmpCx = tmp.getContext('2d');

  img.style.visibility = 'hidden';
  canvas.style.display = 'block';

  const steps = [48, 32, 20, 12, 7, 4, 2, 1];
  let i = 0;
  function drawStep(){
    const block = steps[i];
    const tw = Math.max(1, Math.round(w / block));
    const th = Math.max(1, Math.round(h / block));
    tmp.width = tw; tmp.height = th;
    tmpCx.imageSmoothingEnabled = true;
    tmpCx.drawImage(img, 0, 0, tw, th);
    mainCx.clearRect(0, 0, w, h);
    mainCx.drawImage(tmp, 0, 0, tw, th, 0, 0, w, h);
    i++;
    if (i < steps.length){
      ctx.addTimer(drawStep, 90);
    } else {
      ctx.addTimer(()=>{ canvas.style.display = 'none'; img.style.visibility = ''; }, 250);
    }
  }
  drawStep();
}

function playTilt3D(ctx){
  const {stage, frame, overlay} = ctx;
  const maxTilt = 14;
  frame.style.transition = 'transform 0.15s ease-out';
  overlay.style.mixBlendMode = 'screen';
  overlay.style.opacity = '0.5';

  function onMove(e){
    const rect = frame.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rx = (0.5 - y) * maxTilt;
    const ry = (x - 0.5) * maxTilt;
    frame.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.04)`;
    overlay.style.background = `radial-gradient(circle at ${x*100}% ${y*100}%, rgba(255,255,255,.4), transparent 55%)`;
  }
  function onLeave(){
    frame.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)';
  }
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerleave', onLeave);

  ctx.setCleanup(()=>{
    stage.removeEventListener('pointermove', onMove);
    stage.removeEventListener('pointerleave', onLeave);
    frame.style.transform = '';
    frame.style.transition = '';
    overlay.style.background = '';
    overlay.style.opacity = '';
    overlay.style.mixBlendMode = '';
  });
}

   ============================================================ */

  playFlash(ctx);
  ctx.addTimer(()=>playStarBurstRays(ctx), 120);
  ctx.addTimer(()=>playSparkleParticles(ctx), 200);
  ctx.addTimer(()=>{
    setAnim(ctx.img, 'fxAuraPulse', {duration:'1.8s', easing:'ease-in-out', iteration:'infinite'});
  }, 500);
  ctx.setCleanup(()=>{ ctx.img.style.animation = ''; ctx.img.style.filter = ''; });
}
function playComboUltra(ctx){
  playImpactShock(ctx);
  ctx.addTimer(()=>{
    const {overlay} = ctx;
    overlay.style.background = 'repeating-linear-gradient(115deg,#ff5f6d,#ffc371,#f9f871,#6fffb0,#63d9ff,#a06bff,#ff5f6d)';
    overlay.style.backgroundSize = '300% 300%';
    overlay.style.mixBlendMode = 'color-dodge';
    overlay.style.opacity = '0.55';
    setAnim(overlay, 'fxHoloShimmer', {duration:'3.4s', easing:'linear', iteration:'infinite'});
  }, 260);
  ctx.addTimer(()=>playStarBurstRays(ctx), 300);
  ctx.addTimer(()=>playSparkleParticles(ctx), 500);
  const sparkleLoop = ctx.addInterval(()=>playSparkleParticles(ctx), 900);
  ctx.addTimer(()=>{
    setAnim(ctx.img, 'fxAuraPulse', {duration:'1.6s', easing:'ease-in-out', iteration:'infinite'});
  }, 260);
  ctx.setCleanup(()=>{
    clearInterval(sparkleLoop);
    ctx.img.style.animation = '';
    ctx.img.style.filter = '';
    ctx.overlay.style.animation = '';
    ctx.overlay.style.background = '';
    ctx.overlay.style.opacity = '';
    ctx.overlay.style.mixBlendMode = '';
  });
}

function hexToRgba(hex, a){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16);
  const g = parseInt(v.substring(2,4),16);
  const b = parseInt(v.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

      group.appendChild(opt);
    });
    effectSelect.appendChild(group);
  });

  statNum.textContent = EFFECTS.length;
}

/* ---------------- 実装メモを更新 ---------------- */
function updateNotes(){
  const id = effectSelect.value;
  if (id === 'none'){
    notesGroup.textContent = '—';
    notesGroup.style.background = 'rgba(255,255,255,.06)';
    notesGroup.style.color = 'var(--text-secondary)';
    notesGroup.style.borderColor = 'var(--border)';
    notesTech.textContent = '—';
    notesText.textContent = '「演出なし」を選択中です。ドロップダウンから演出を選ぶと、ここに実装方法の解説が表示されます。';
    return;
  }
  const eff = EFFECTS.find(e=>e.id===id);
  if (!eff) return;
  const color = GROUP_COLORS[eff.group];
  notesGroup.textContent = GROUP_LABELS[eff.group].replace(/（.*）/,'');
  notesGroup.style.background = hexToRgba(color, .16);
  notesGroup.style.color = color;
  notesGroup.style.borderColor = hexToRgba(color, .45);
  notesTech.textContent = eff.tech;
  notesText.textContent = eff.note;
}

/* ---------------- 演出の再生 ---------------- */
function playCurrent(){
  const id = effectSelect.value;
  resetStage();
  if (id === 'none') return;
  const fn = EFFECT_FN[id];
  if (!fn) return;
  fn(buildCtx());
}

/* ---------------- イベント配線 ---------------- */
effectSelect.addEventListener('change', ()=>{
  updateNotes();
  playCurrent();
});
playBtn.addEventListener('click', playCurrent);
resetBtn.addEventListener('click', ()=>{
  effectSelect.value = 'none';
  updateNotes();
  resetStage();
});
randomBtn.addEventListener('click', ()=>{
  const pick = EFFECTS[Math.floor(Math.random() * EFFECTS.length)];
  effectSelect.value = pick.id;
  updateNotes();
  playCurrent();
});

/* ---------------- 初期化 ---------------- */
function init(){
  buildSelect();
  effectSelect.value = 'none';
  updateNotes();
}
window.addEventListener('load', init);

</script>
