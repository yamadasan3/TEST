<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像一覧</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #166;
            color: white;
            font-family: sans-serif;
        }

        h1 {
            margin-bottom: 30px;
        }

        .image-library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 40px;
        }

        .image-item {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        .image-name {
            margin-top: 8px;
            font-size: 13
                px;
        }
        #image-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
}

#modal-image {
    max-width: 90%;
    max-height: 90%;
}
    </style>
</head>

<body>

<h1>画像ライ</h1>

<div class="image-library">

    <div class="image-item">
        <img src="pcs02-003.png" alt="カード">
        <div class="image-name">pcs02-003</div>
    </div>

    <div class="image-item">
        <img src="card02.png" alt="カード2">
        <div class="image-name">card02</div>
    </div>

    <div class="image-item">
        <img src="card03.png" alt="カード3">
        <div class="image-name">card03</div>
    </div>

</div>
<div id="image-modal">
    <img id="modal-image" src="" alt="">
</div>

    <script>
const images = document.querySelectorAll(".image-item img");
const modal = document.getElementById("image-modal");
const modalImage = document.getElementById("modal-image");

images.forEach(function(image) {

    image.addEventListener("click", function() {

        modalImage.src = image.src;
        modalImage.alt = image.alt;

        modal.style.display = "flex";

    });

});

modal.addEventListener("click", function() {

    modal.style.display = "none";

});
</script>
</body>
</html>
