<h2>3Dモデル表示エリア（ここにGLBファイルをドラッグ＆ドロップ！）</h2>

<!-- ① model-viewerを動かすためのプログラム -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<!-- ② id="viewer" を追加して、プログラムから操作できるようにする -->
<model-viewer id="viewer" src="Meshy_AI_Smiling_Blue_Slime_0919143826_texture.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1"> 
</model-viewer>

<!-- ③ ドラッグ＆ドロップでモデルを切り替えるためのJavaScript -->
<script>
    const viewer = document.getElementById('viewer');

    // ファイルが上に乗せられたときのブラウザの標準動作（ファイルを開いてしまう挙動）をキャンセル
    viewer.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    // ファイルがドロップされたときの処理
    viewer.addEventListener('drop', (e) => {
        e.preventDefault();

        // ドロップされたファイルを取得
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files.log || files[0]; // 念のためファイルオブジェクトを取得

            // .glb または .gltf ファイルかどうかをチェック
            if (file.name.endsWith('.glb') || file.name.endsWith('.gltf')) {
                // ローカルファイル一時URLを生成して model-viewer にセット
                const blobUrl = URL.createObjectURL(file);
                viewer.src = blobUrl;
                console.log('モデルを切り替えました:', file.name);
            } else {
                alert('GLBまたはGLTFファイルを選択してください。');
            }
        }
    });
</script>
